version: '3.8'

name: certo

services:
  app:
    build: .
    image: bhatol/certo:latest
    ports:
      - "8080:8080"
    volumes:
      - certo_data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  certo_data:
