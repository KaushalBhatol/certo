<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>404 — Certo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --sidebar-bg: #0f172a;
      --content-bg: #f1f5f9;
      --text-primary: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--content-bg);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      max-width: 520px;
      padding: 2rem;
    }

    .icon-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .icon-ring {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(79,70,229,0.06));
      border: 2px solid rgba(99,102,241,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-ring svg {
      color: var(--accent);
    }

    .badge-404 {
      position: absolute;
      bottom: -6px;
      right: -6px;
      background: var(--accent);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(99,102,241,0.4);
      border: 2px solid var(--content-bg);
    }

    .code {
      font-size: 5rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #0f172a 0%, #475569 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(99,102,241,0.35);
      transition: background 0.15s, box-shadow 0.15s;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 14px rgba(99,102,241,0.45);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: #fff;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-secondary:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .divider {
      width: 48px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), #4f46e5);
      border-radius: 999px;
      margin: 1.25rem auto 1.5rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
      text-decoration: none;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(99,102,241,0.25);
    }

    .brand-name {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      background: linear-gradient(135deg, #0f172a, #475569);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
</head>
<body>
  <div class="container">

    <a href="/" class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <span class="brand-name">CERTO</span>
    </a>

    <div class="icon-wrap">
      <div class="icon-ring">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          <line x1="11" y1="8" x2="11" y2="11"/>
          <line x1="11" y1="14" x2="11.01" y2="14"/>
        </svg>
      </div>
      <span class="badge-404">404</span>
    </div>

    <div class="code">404</div>
    <div class="divider"></div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or may have been moved.<br>Double-check the URL or head back to safety.</p>

    <div class="actions">
      <a href="/" class="btn-primary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Go Home
      </a>
      <a href="javascript:history.back()" class="btn-secondary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Go Back
      </a>
    </div>

  </div>
</body>
</html>
