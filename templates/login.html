<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login — Certo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .login-wrap {
      width: 100%;
      max-width: 380px;
      padding: 1.5rem;
    }

    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      background: #6366f1;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.85rem;
      box-shadow: 0 4px 20px rgba(99,102,241,0.4);
    }

    .brand h4 {
      color: #f8fafc;
      font-weight: 700;
      letter-spacing: 0.12em;
      margin: 0 0 0.2rem;
      font-size: 1.25rem;
    }

    .brand p {
      color: #475569;
      font-size: 0.82rem;
      margin: 0;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }

    .form-label {
      color: #94a3b8;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-bottom: 0.35rem;
      display: block;
    }

    .form-control {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 0.875rem;
      padding: 0.55rem 0.85rem;
      width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    .form-control:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }

    .form-control::placeholder { color: #475569; }

    .btn-login {
      width: 100%;
      background: #6366f1;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.6rem;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
      margin-top: 0.25rem;
    }

    .btn-login:hover {
      background: #4f46e5;
      box-shadow: 0 4px 14px rgba(99,102,241,0.4);
    }

    .alert-error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      color: #fca5a5;
      font-size: 0.82rem;
      padding: 0.6rem 0.85rem;
      margin-top: 1rem;
      text-align: center;
    }

    .mb-4 { margin-bottom: 1.25rem; }
    .mb-5 { margin-bottom: 1.5rem; }
  </style>
</head>

<body>
  <div class="login-wrap">
    <div class="brand">
      <div class="brand-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7z"/>
        </svg>
      </div>
      <h4>CERTO</h4>
      <p>Certificate Authority Manager</p>
    </div>

    <div class="card">
      <form method="POST">
        <div class="mb-4">
          <label class="form-label">Username</label>
          <input name="username" class="form-control" placeholder="Enter your username" required autofocus>
        </div>
        <div class="mb-5">
          <label class="form-label">Password</label>
          <input name="password" type="password" class="form-control" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn-login">Sign in</button>
      </form>

      {% with messages = get_flashed_messages() %}
      {% if messages %}
      <div class="alert-error">{{ messages[0] }}</div>
      {% endif %}
      {% endwith %}
    </div>
  </div>
</body>

</html>
